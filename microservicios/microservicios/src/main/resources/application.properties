spring.application.name=microservicios
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/turbus_microservicios_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de logging
logging.level.cl.DSY1103.pasajeros=DEBUG
logging.pattern.console=%d{dd-MM-yyyy HH:mm:ss} - %msg%n